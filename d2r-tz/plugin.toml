id = "bioinformatist/d2r-tz"
name = "暗黑2恐怖地带"
version = "0.1.1"
plugin_api = 24
author = "bioinformatist"
license = "MIT"
icon = "skull"
description = "显示术士君临在线恐怖地带及经验、掉落评级。"
tags = ["gaming", "diablo"]
dependencies = ["xdg-open"]

[[setting]]
key = "zone_language"
type = "select"
label_key = "settings.zone_language.label"
default = "zh-Hans"
options = [
  { value = "en", label_key = "settings.zone_language.en" },
  { value = "zh-Hans", label_key = "settings.zone_language.zh-Hans" },
]

[[widget]]
id = "tz"
entry = "widget.luau"

[[service]]
id = "tracker"
entry = "tracker.luau"
